<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova Solutions - Employee Portal Login.</title>
    <style>
        /*To Make the Background Color Of the Table White*/
        table{
            background-color: rgb(255, 255, 255);
        }
         /*To Change the Background Color of the Website*/
        body{
            background-color: rgb(84, 195, 239);
        }
        /*To Add the Box in the Header*/
        h2{
            padding: 10px;
            width: 60%;
            border: 1px solid black;
            background-color: #4CAF50;
            color: white;
        }
        /* To Remove the border from table cells and some spacing*/
        th,td,tr{
            border: none;
            padding: 10px 20px 15px 5px;
            color: green;
        }
        
        input[type="text"], input[type="password"]{
            width: 80%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid green;
        }
        input[type="submit"], input[type="reset"]{
            padding: 8px 16px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <center>
        <h1>TechNova Solutions</h1>
        <form>
            <table border="3" width="30%" bordercolor="green">
                <thead  align="center">
                    <th colspan="2"><h2>Portal Login</h2></th>
                </thead>
                <tbody>
                    <tr>
                        <td align="right">Username:</td>
                        <td><input type="text" name="username" required border-color="green"></td>

                    </tr>
                    <tr>
                        <td align="right">Password:</td>
                        <td><input type="password" name="password" required></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <p>Created by: Jethro A Rosales - Grade 12 Cooper</p>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </form>
    </center>
</body>
</html>
