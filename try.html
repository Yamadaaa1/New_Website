<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #ffebee;                                                                                                                                                                                                                                                                                                                                                            /*made by jethro*/
        padding: 20px;
        margin: 20px;
      }

      h1 {
        color: #b71c1c;
        text-align: center;
      }

      button {
        background-color: #b71c1c;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 40px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }

      table {
        background-color: white;
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background-color: #b71c1c;
        color: white;
      }

      th, td {
        padding: 8px;
        border: 1px solid #b71c1c;
      }
    </style>
  </head>

  <body>
      <h1>Student Information</h1>
      <center>
        <label>Lrn</label>
        <input type="text" id="lrn" name="lrn" minlength="5" maxlength="11" required />

        <label>Name</label>
        <input type="text" id="name" name="name" required />

        <label>Subject</label>
        <input type="text" id="subject" name="subject" required />

        <label>Grade</label>
        <input type="number" id="grade" name="grade" min="0" max="100" required />
        <button id="submit" onclick="saveGrade()">Save</button>
      </center>
      
      <p id="message"></p>
      <h3></h3>
      <br>
      <table border="1">
        <thead>
          <tr>
            <th>Lrn</th>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>

    <script>
      const lrnInput = document.getElementById("lrn");
      const nameInput = document.getElementById("name");
      const subjectInput = document.getElementById("subject");
      const gradeInput = document.getElementById("grade");
      const message = document.getElementById("message");
      const tableBody = document.getElementById("table-body");
      const btnSave = document.getElementById("submit");
      var grades = JSON.parse(localStorage.getItem("grades")) || [];
      var selectedIndex = -1;

      function showGrades() {
        tableBody.textContent = "";
        for (var i = 0; i < grades.length; i++) {
          var row = tableBody.insertRow();
          row.insertCell(0).textContent = grades[i].lrn;
          row.insertCell(1).textContent = grades[i].name;
          row.insertCell(2).textContent = grades[i].subject;
          row.insertCell(3).textContent = grades[i].grade;

          var actionCell = row.insertCell();
          actionCell.appendChild(makeUpdateButton(i));
          actionCell.appendChild(makeDeleteButton(i));
        }
      }

      function makeUpdateButton(index) {
        var button = document.createElement("button");
        button.textContent = "Update";
        button.style.marginRight = "5px";
        button.addEventListener("click", function () {
          loadForUpdate(index);
        });
        return button;
      }

      function makeDeleteButton(index) {
        var button = document.createElement("button");
        button.textContent = "Delete";
        button.addEventListener("click", function() {
          deleteGrade(index);
        });
        return button;
      }

      function loadForUpdate(index) {
        selectedIndex = index;
        lrnInput.value = grades[index].lrn;
        nameInput.value = grades[index].name;
        subjectInput.value = grades[index].subject;
        gradeInput.value = grades[index].grade;
        btnSave.textContent = "Update Grade";
        message.textContent = "Change the values, then click 'Update Grade' button above";
      }

      function saveGrade() {
        var lrn = lrnInput.value.trim();
        var name = nameInput.value.trim();
        var subject = subjectInput.value.trim();
        var grade = gradeInput.value.trim();

        if (lrn === "" || name === "" || subject === "" || grade === "") {
          message.textContent = "Please fill in all the boxes";
          return;
        }

        var record = {
          lrn: lrn,
          name: name,
          subject: subject,
          grade: grade,
        };

        if (selectedIndex === -1) {
          grades.push(record);
          message.textContent = "Grade saved successfully!";
        } else {
          grades[selectedIndex] = record;
          message.textContent = "Grade updated successfully!";
          selectedIndex = -1;
          btnSave.textContent = "Save";
        }

        localStorage.setItem("grades", JSON.stringify(grades));

        lrnInput.value = "";
        nameInput.value = "";
        subjectInput.value = "";
        gradeInput.value = "";

        showGrades();
      }

      function deleteGrade(index) {
        var sure = confirm("Delete the record of " + grades[index].name + "?");
        if (!sure) {
          return;
        }

        grades.splice(index, 1);
        if (selectedIndex === index) {
          selectedIndex = -1;
          btnSave.textContent = "Save";
          lrnInput.value = "";
          nameInput.value = "";
          subjectInput.value = "";
          gradeInput.value = "";
        } else if (selectedIndex > index) {
          selectedIndex = selectedIndex - 1;
        }
        
        localStorage.setItem("grades", JSON.stringify(grades));
        message.textContent = "Record deleted";
        showGrades();
      }

      showGrades();
    </script>
  </body>
</html>
