<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="stylesheet" href="menuStyle.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      .carousel {
        width: 90%;
        max-width: 650px;
        margin: 30px auto;
        text-align: center;
      }

      .slides {
        position: relative;
        background: #222;
        height: 400px;
        overflow: hidden;
        border-radius: 8px;
      }

      .slide {
        display: none;
        height: 100%;
        width: 100%;
        margin: 0;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      .buttons {
        margin-top: 15px;
      }

      .buttons button {
        background: #b71c1c;
        color: white;
        border: none;
        padding: 10px 16px;
        cursor: pointer;
        border-radius: 4px;
      }

      .buttons button:hover {
        background: #e53935;
      }

      #slide-number {
        margin: 0 15px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="Main Navigation">
      <ul class="nav-list">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="gallery.html">Gallery</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="portfolio.html">Portfolio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contact</a>
        </li>
      </ul>
    </nav>

    <div class="carousel" id="carousel">
      <div class="slides">
        <figure class="slide">
          <img src="gallery/future.jpg" alt="Gallery image 1" />
        </figure>
        <figure class="slide">
          <img src="gallery/me.jpg" alt="Gallery image 2" />
        </figure>
        <figure class="slide">
          <img src="gallery/fam.jpg" alt="Gallery image 3" />
        </figure>
        <figure class="slide">
          <img src="gallery/hob1.png" alt="Gallery image 4" />
        </figure>
        <figure class="slide">
          <img src="gallery/hob2.png" alt="Gallery image 4" />
        </figure>
        <figure class="slide">
          <img src="gallery/hob3.png" alt="Gallery image 4" />
        </figure>
        <figure class="slide">
          <img src="gallery/friend.jpeg" alt="Gallery image 4" />
        </figure>
        <figure class="slide">
          <img src="gallery/friends.jpeg" alt="Gallery image 4" />
        </figure>
      </div>
      <div class="buttons">
        <button id="previous" type="button">Previous</button>
        <span id="slide-number">1 / 6</span>
        <button id="next" type="button">Next</button>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-text">
          <h3>Stay Connected!</h3>
          <p>
            Thank you for visiting my website. Connect with me on social media
            or reach out via email for collaborations and inquiries. Your
            support and feedback are greatly appreciated.
          </p>
        </div>

        <div class="footer-social">
          <h3>Follow Me</h3>
          <div class="social-links">
            <a href="https://www.facebook.com/">f</a>
            <a href="https://www.youtube.com/">▶</a>
            <a href="https://www.linkedin.com/">in</a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <p>©2026 Niggers Corp</p>
      </div>
    </footer>

    <script>
      $(document).ready(function () {
        let currentSlide = 0;
        let slides = $(".slide");
        let totalSlides = slides.length;

        function showSlide(index) {
          slides.hide();
          slides.eq(index).fadeIn(300);
          $("#slide-number").text(index + 1 + " / " + totalSlides);
        }

        $("#next").click(function () {
          currentSlide++;
          if (currentSlide >= totalSlides) currentSlide = 0;
          showSlide(currentSlide);
        });

        $("#previous").click(function () {
          currentSlide--;
          if (currentSlide < 0) currentSlide = totalSlides - 1;
          showSlide(currentSlide);
        });

        showSlide(currentSlide);
      });
    </script>
  </body>
</html>
