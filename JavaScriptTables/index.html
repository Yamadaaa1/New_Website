<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabular Data</title>
    <script src="studentScript.js" defer></script>
    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        table{
            border-collapse:collapse;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-color: #eee;
        }
        thead{
            background-color: rgb(139, 139, 241);
            color: black;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 40px;
        }
        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border: 1px solid #eee;
        }
        tbody td img {
            width: 100%;
            height: 80px;
            border-radius: 10%;
            object-fit: cover;
            border: 2px solid #e2a1a1;
        }
    </style>
</head>
<body>
    <table border="2">
        <thead>
            <tr>
                <th><a href="Randombs/indexx.html" style="text-decoration: none; color: black;">LRN</a></th>
                <th>NAME</th>
                <th>AGE</th>
                <th>SECTION</th>
                <th>IMAGES</th>
            </tr>
        </thead>
        <tbody id="output">
        </tbody>
    </table>
</body>
</html>
