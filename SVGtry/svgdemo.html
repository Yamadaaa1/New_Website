
<!DOCTYPE html>
<html>
<head>
  <title>SVG Shapes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 850px;
      margin: auto;
    }

    .box {
      border: 2px solid black;
      padding: 15px;
      background-color: white;
      text-align: center;
      border-radius: 8px;
    }

    svg {
      max-width: 100%;
    }
  </style>
</head>

<body>

  <h1>SVG Shapes</h1>
   <a href="/New_Website/portfolio.html">Back To Portfolio</a>

  <div class="container">

    <div class="box">
      <h3>Circle</h3>
      <svg width="100" height="100">
        <circle
          cx="50"
          cy="50"
          r="40"
          stroke="green"
          stroke-width="4"
          fill="yellow" />
      </svg>
    </div>

    <div class="box">
      <h3>Rounded Rectangle</h3>
      <svg width="400" height="180">
        <rect x="50" y="20" rx="20" ry="20" width="150" height="150"
        style="fill:red;stroke:black;stroke-width:5;opacity:0.5" />
      </svg>
    </div>

    <div class="box">
      <h3>Polygon</h3>
      <svg width="300" height="200">
        <polygon points="100,10 40,198 190,78 10,78 160,198"
        style="fill:lime;stroke:purple;stroke-width:5;fill-rule:evenodd;" />
      </svg>
    </div>

    <div class="box">
      <h3>Rectangle</h3>
      <svg width="400" height="120">
        <rect x="10" y="10" width="200" height="100"
        stroke="red" stroke-width="6" fill="blue" />
      </svg>
    </div>

    <div class="box">
      <h3>Oval</h3>
      <svg height="130" width="500">
        <defs>
          <linearGradient id="grad1">
            <stop offset="0%" stop-color="yellow" />
            <stop offset="100%" stop-color="red" />
          </linearGradient>
        </defs>

        <ellipse cx="100" cy="70" rx="85" ry="55"
        fill="url(#grad1)" />

        <text fill="#ffffff" font-size="45"
        font-family="Verdana" x="50" y="86">SVG</text>
      </svg>
    </div>

  </div>

</body>
</html>
